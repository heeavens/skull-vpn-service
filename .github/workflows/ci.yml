name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm db:check
      - run: pnpm db:generate
      - run: git diff --exit-code -- drizzle
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --tag vpn-service:ci .
      - name: Smoke-test native SQLite in the runtime image
        run: >-
          docker run --rm vpn-service:ci node -e
          "const Database=require('better-sqlite3');
          const db=new Database(':memory:');
          db.prepare('select 1').get();
          db.close()"
      - name: Smoke-test migrations in the runtime image
        run: docker run --rm --env DATABASE_URL=/tmp/app.db vpn-service:ci node scripts/migrate.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
